# H2 Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration (test) - must be at least 256 bits for HS256
jwt.secret=test-jwt-secret-key-for-testing-purposes-only-must-be-long-enough
jwt.expiration=3600000

# WeChat Mini Program Configuration (test)
wx.miniapp.configs.default.appid=test-appid
wx.miniapp.configs.default.secret=test-secret

# Face Recognition Service (test)
face.service.url=http://localhost:8000/recognize

# Spot check configuration for tests
spotcheck.avg-interval-minutes=60
spotcheck.min-interval-minutes=10
spotcheck.max-interval-minutes=120
spotcheck.response-minutes=15
spotcheck.session-timeout-hours=8
spotcheck.min-work-hours=1
spotcheck.last-hour-no-check=true

# WeChat notification configuration for tests
wx.notification.enabled=false
wx.notification.spot-check-template-id=test-template-id
wx.notification.spot-check-page=pages/spot-check/index
wx.notification.miniprogram-state=developer

# Disable Redis auto-configuration for unit tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Logging
logging.level.com.duhao.security.checkinapp=DEBUG
