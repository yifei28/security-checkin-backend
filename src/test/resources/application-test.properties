# H2 Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration (test)
jwt.secret=test-jwt-secret-key-for-testing-purposes-only

# WeChat Mini Program Configuration (test)
wechat.mini.appid=test-appid
wechat.mini.secret=test-secret

# Face Recognition Service (test)
face.service.url=http://localhost:8000/recognize