spring.application.name=secuity-checkin

# Database configuration for Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/security_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Wodemimashi123a-}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
jwt.secret=${JWT_SECRET:H8s4kT9vLmA2pX6eWqZ1rB3nDfU7cVy0}
jwt.expiration=${JWT_EXPIRATION:3600000}

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Face recognition service
face.service.url=${FACE_SERVICE_URL:http://face-recognition:8000/recognize}

# WeChat Mini Program (use environment variables in production)
wx.miniapp.configs.default.appid=${WECHAT_APPID:wx830cbb70e245f9ec}
wx.miniapp.configs.default.secret=${WECHAT_SECRET:21226beb806d45e911685cc4976957db}

# Time zone configuration
spring.jackson.time-zone=UTC
