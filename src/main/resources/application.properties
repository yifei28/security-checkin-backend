spring.application.name=secuity-checkin

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/security_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

face.service.url=${FACE_SERVICE_URL:http://localhost:8000/recognize}

wx.miniapp.configs.default.appid=${WECHAT_APPID:}
wx.miniapp.configs.default.secret=${WECHAT_SECRET:}

spring.jackson.time-zone=Asia/Shanghai
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

logging.level.com.duhao.security.checkinapp.controller.CheckinController=DEBUG
logging.level.com.duhao.security.checkinapp=DEBUG
logging.level.org.springframework.web=INFO
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n