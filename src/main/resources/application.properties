spring.application.name=secuity-checkin

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/security_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

face.service.url=${FACE_SERVICE_URL:http://localhost:8000/recognize}

wx.miniapp.configs.default.appid=${WECHAT_APPID:}
wx.miniapp.configs.default.secret=${WECHAT_SECRET:}

spring.jackson.time-zone=Asia/Shanghai
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# Redis Configuration (DB 1, 人脸识别服务用 DB 0)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=1
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000ms

# Spot Check Configuration
# 每个工作片段最多抽查次数
spotcheck.max-checks-per-session=3

# 动态间隔配置（根据已完成抽查次数）
# 阶段1（0次已抽）：90-150分钟
spotcheck.stage1-min-interval=90
spotcheck.stage1-max-interval=150
# 阶段2（1次已抽）：120-200分钟
spotcheck.stage2-min-interval=120
spotcheck.stage2-max-interval=200
# 阶段3（2次已抽）：150-250分钟
spotcheck.stage3-min-interval=150
spotcheck.stage3-max-interval=250

# 以下为旧配置，已弃用但保留兼容
spotcheck.avg-interval-minutes=120
spotcheck.min-interval-minutes=30
spotcheck.max-interval-minutes=240

# 抽查响应时间（分钟）
spotcheck.response-minutes=15
# 工作片段超时时间（小时）
spotcheck.session-timeout-hours=16
# 最小工作时长（小时），下岗前必须满足
spotcheck.min-work-hours=1

# WeChat Notification Configuration
wx.notification.enabled=${WX_NOTIFICATION_ENABLED:true}
# 多模板轮换配置（逗号分隔），优先于单模板配置
wx.notification.spot-check-template-ids=${WX_SPOTCHECK_TEMPLATE_IDS:}
# 兼容旧配置：单模板ID（如果 spot-check-template-ids 为空则使用此配置）
wx.notification.spot-check-template-id=${WX_SPOTCHECK_TEMPLATE_ID:}
wx.notification.spot-check-page=pages/spot-check/index
wx.notification.miniprogram-state=${WX_MINIPROGRAM_STATE:formal}
wx.notification.lang=zh_CN

logging.level.com.duhao.security.checkinapp.controller.CheckinController=DEBUG
logging.level.com.duhao.security.checkinapp=DEBUG
logging.level.org.springframework.web=INFO
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n