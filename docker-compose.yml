services:
  mysql:
    image: mysql:8.0
    container_name: security-checkin-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Wodemimashi123a-}
      MYSQL_DATABASE: security_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - security-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Wodemimashi123a-}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: security-checkin-app:${VERSION:-latest}
    container_name: security-checkin-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      face-recognition:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/security_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Wodemimashi123a-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      FACE_SERVICE_URL: ${FACE_SERVICE_URL:-http://face-recognition:8000/recognize}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Wodemimashi123a-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Duser.timezone=Asia/Shanghai}
      SERVER_TOMCAT_ACCEPT_COUNT: ${TOMCAT_ACCEPT_COUNT:-100}
      SERVER_TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      # 多模板轮换（逗号分隔）
      WX_SPOTCHECK_TEMPLATE_IDS: ${WX_SPOTCHECK_TEMPLATE_IDS:-}
      # 兼容旧配置
      WX_SPOTCHECK_TEMPLATE_ID: ${WX_SPOTCHECK_TEMPLATE_ID:-}
      TZ: Asia/Shanghai
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - security-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for face recognition service and delay queue
  redis:
    image: redis:7-alpine
    container_name: face-recognition-redis
    # 不暴露端口到公网，只在 Docker 网络内访问
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"
    networks:
      - security-network
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-Wodemimashi123a-}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Wodemimashi123a-}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Face recognition service
  face-recognition:
    build:
      context: ${FACE_SERVICE_BUILD_CONTEXT:-~/facial-recognition-service}
      dockerfile: Dockerfile
    image: ${FACE_RECOGNITION_IMAGE:-face-recognition:latest}
    container_name: face-recognition-service
    ports:
      - "${FACE_SERVICE_PORT:-8000}:8000"
    networks:
      - security-network
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-Wodemimashi123a-}
      - REDIS_DB=0
      - MODEL_PATH=/app/models/20180402-114759-vggface2.pt
      - EMBEDDING_THRESHOLD=0.8
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    volumes:
      - ${FACE_SERVICE_MODELS_PATH:-~/facial-recognition-service/models}:/app/models:ro

  # Optional: Nginx reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   container_name: security-checkin-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - security-network
  #   restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  security-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16