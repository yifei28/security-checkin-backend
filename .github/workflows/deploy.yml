name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'

jobs:
  # CI阶段：测试和构建
  test:
    runs-on: ubuntu-latest
    name: 🧪 Test & Build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '**/maven-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-maven-
        
    - name: Run tests (with Maven offline mode)
      run: ./mvnw test --batch-mode --no-transfer-progress
      
    - name: Build application (optimized)
      run: ./mvnw package -DskipTests --batch-mode --no-transfer-progress -Dmaven.compiler.fork=true
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jar-artifact
        path: target/*.jar

  # CD阶段：部署到生产环境
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        command_timeout: 20m
        script: |
          # 设置项目目录路径
          PROJECT_DIR="$HOME/security-checkin-backend"
          
          # 检查项目目录是否存在，如果不存在则克隆
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "🔄 Repository not found, cloning..."
            git clone https://github.com/yifei28/security-checkin-backend.git "$PROJECT_DIR"
          fi
          
          # 切换到项目目录
          cd "$PROJECT_DIR"
          
          # 配置Git安全目录（避免权限问题）
          git config --global --add safe.directory "$PROJECT_DIR"
          
          # 拉取最新代码，如果失败则尝试重新获取
          echo "📡 Pulling latest changes..."
          if ! git pull origin main; then
            echo "⚠️ Git pull failed, trying to reset and pull again..."
            if ! git fetch origin; then
              echo "🔄 Fetch failed, re-cloning repository..."
              cd "$HOME"
              rm -rf "$PROJECT_DIR"
              git clone https://github.com/yifei28/security-checkin-backend.git "$PROJECT_DIR"
              cd "$PROJECT_DIR"
            else
              git reset --hard origin/main
            fi
          fi
          
          # 检查deploy.sh是否存在
          if [ ! -f "./deploy.sh" ]; then
            echo "❌ deploy.sh not found in repository"
            echo "📁 Current directory contents:"
            ls -la
            exit 1
          fi
          
          # 使用部署脚本
          chmod +x deploy.sh
          ./deploy.sh
        
    - name: Notify deployment status
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "🎉 Deployment to production succeeded!"
        else
          echo "💥 Deployment failed!"
        fi

  # 可选：通知阶段
  notify:
    runs-on: ubuntu-latest
    name: 📢 Notify
    needs: [test, deploy]
    if: always()
    
    steps:
    - name: Notification
      run: |
        echo "Pipeline completed:"
        echo "Test status: ${{ needs.test.result }}"
        echo "Deploy status: ${{ needs.deploy.result }}"