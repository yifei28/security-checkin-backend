name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'

jobs:
  # CI阶段：测试和构建
  test:
    runs-on: ubuntu-latest
    name: 🧪 Test & Build
    permissions:
      contents: read
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '**/maven-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-maven-
        
    - name: Run unit tests
      run: ./mvnw test --batch-mode --no-transfer-progress

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: JUnit Test Results
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: false

    - name: Generate test coverage report
      run: ./mvnw jacoco:report --batch-mode --no-transfer-progress
      if: success()

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: coverage-report
        path: target/site/jacoco/

    - name: Build application
      run: ./mvnw package -DskipTests --batch-mode --no-transfer-progress -Dmaven.compiler.fork=true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jar-artifact
        path: target/*.jar

  # CD阶段：部署到生产环境
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        command_timeout: 25m
        script: |
          # 设置项目目录路径
          PROJECT_DIR="$HOME/security-checkin-backend"
          
          # 首次部署：检查项目目录是否存在
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "🔄 First deployment - cloning repository..."
            git clone https://github.com/yifei28/security-checkin-backend.git "$PROJECT_DIR"
          fi
          
          # 切换到项目目录
          cd "$PROJECT_DIR"
          
          # 配置Git安全目录
          git config --global --add safe.directory "$PROJECT_DIR"
          
          # 检查deploy.sh是否存在
          if [ ! -f "./deploy.sh" ]; then
            echo "❌ deploy.sh not found in repository"
            exit 1
          fi
          
          # 使用部署脚本（包含所有重试和错误处理逻辑）
          chmod +x deploy.sh
          ./deploy.sh
        
    - name: Notify deployment status
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "🎉 Deployment to production succeeded!"
        else
          echo "💥 Deployment failed!"
        fi

  # 可选：通知阶段
  notify:
    runs-on: ubuntu-latest
    name: 📢 Notify
    needs: [test, deploy]
    if: always()
    
    steps:
    - name: Notification
      run: |
        echo "Pipeline completed:"
        echo "Test status: ${{ needs.test.result }}"
        echo "Deploy status: ${{ needs.deploy.result }}"